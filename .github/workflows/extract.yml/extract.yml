
name: Extract NovaVault ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project files
        run: |
          python - <<'PY'
          import zipfile, os, shutil
          z = zipfile.ZipFile("novavault-platform-source.zip")
          names = [n for n in z.namelist() if n.strip()]
          roots = {n.split('/')[0] for n in names}
          strip = next(iter(roots)) if len(roots) == 1 else None
          for n in names:
              parts = n.split('/')
              if strip and parts[0] == strip:
                  parts = parts[1:]
              if not parts:
                  continue
              dest = os.path.join(*parts)
              if n.endswith('/'):
                  os.makedirs(dest, exist_ok=True)
              else:
                  os.makedirs(os.path.dirname(dest) or '.', exist_ok=True)
                  with z.open(n) as src, open(dest, 'wb') as dst:
                      shutil.copyfileobj(src, dst)
          z.close()
          os.remove("novavault-platform-source.zip")
          PY

      - name: Save extracted files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Extract NovaVault project files" || echo "No changes"
          git push
